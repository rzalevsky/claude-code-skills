name: checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install pytest sqlglot jsonschema
      - name: Run tests
        run: pytest -q
      - name: Lint every skill in the repository
        run: python3 skills/skill-doctor/scripts/lint_skill.py skills/ --recursive

  test-without-optional-deps:
    # The fallback paths are the ones that run on somebody else's machine, so they get
    # exercised too rather than taken on trust.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install only pytest
        run: pip install pytest
      - name: Fallback paths still behave
        run: |
          python3 skills/sql-safety-review/scripts/check_sql.py \
            "WITH t AS (DELETE FROM users RETURNING *) SELECT * FROM t" && exit 1 || true
          echo '{"counterparty":"X","amount":1,"currency":"GBP","due_date":"2026-01-01","invoice_number":"1"}' \
            | python3 skills/structured-extraction/scripts/validate_extraction.py \
              --schema skills/structured-extraction/examples/invoice.schema.json && exit 1 || true
          python3 skills/skill-doctor/scripts/lint_skill.py skills/ --recursive
